[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-continuity-mcp"
dynamic = ["version"]
description = "Persistent, shared memory for AI coding agents (Claude Code, Desktop, Cursor, Codex, Gemini CLI...) - diff reads, compaction shield, verified checkpoints and cross-agent handoff. 100% local, no API keys."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Gabriel Cacabelos" }]
keywords = ["mcp", "mcp-server", "claude", "claude-code", "memory", "context", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
]
# Con techo de versión, igual que requirements.txt: una major nueva puede romper el server.
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
semantic = ["fastembed"]
dev = ["pytest>=8.0.0"]

[project.scripts]
claude-continuity-mcp = "server:main"
claude-continuity-watch = "router.watch:main"

[project.urls]
Homepage = "https://github.com/gabicacabelos/claude-continuity-mcp"
Issues = "https://github.com/gabicacabelos/claude-continuity-mcp/issues"

[tool.hatch.version]
path = "server.py"

# La versión y el código viven fuera de pyproject.toml: sin esto, `uvx --from .`
# reusa una build vieja cacheada aunque server.py o router/ hayan cambiado.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "server.py" }, { file = "router/*.py" }]

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "router"]
